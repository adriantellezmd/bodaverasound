<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E1512">
<title>Bodavera Sound · Roxana & Adrián</title>
<meta name="description" content="Roxana & Adrián · 20·03·2027 · Muy pronto, tu invitación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Caslon+Display&family=Montserrat:wght@500;600&display=swap">
<style>
/* Página «Muy pronto» de bodaverasound.com, con la misma entrada que la invitación
   (De la vela a la Ceremonia, v4): el muro a oscuras, el arco y la vela en su cilindro de vidrio.
   Al tocar la llama, la luz crece y aparece «Muy pronto». No hay recorrido: es solo la portada. */
:root{
  --ivory:#E8DFD0; --paper:#F4EFE8; --sand:#B9A58D; --terra:#A45F43; --burg:#6A2635; --choc:#382820; --sombra:#1E1512;
  --display:'Libre Caslon Display','Cormorant Garamond',Georgia,serif;
  --serif:'Cormorant Garamond',Garamond,Georgia,serif;
  --sans:Montserrat,'Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sombra);overflow:hidden;overscroll-behavior:none}
body{color:var(--ivory);font-family:var(--serif);-webkit-font-smoothing:antialiased}
p,h1{margin:0}
button{font:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}

.escena{position:fixed;inset:0;overflow:hidden;background:var(--sombra)}
.col{position:absolute;top:0;bottom:0;left:50%;width:min(100%,calc(100svh*.5625));transform:translateX(-50%);overflow:hidden}
@supports not (height:100svh){.col{width:min(100%,calc(100vh*.5625))}}
.capa{position:absolute;inset:0}
.cubre{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.ante{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.nombres{font-family:var(--display);font-weight:400;font-size:clamp(38px,11.5vw,50px);line-height:1;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.lema{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.38em;text-transform:uppercase}
.filete{display:flex;align-items:center;gap:10px;width:120px}
.filete::before,.filete::after{content:"";flex:1;height:1px;background:currentColor}
.filete i{width:6px;height:6px;background:currentColor;transform:rotate(45deg)}

/* el muro con el arco, iluminado desde la llama */
#muro .sombra,#muro .calor{position:absolute;inset:0;-webkit-mask-image:url(img/muro-arco.webp);mask-image:url(img/muro-arco.webp);-webkit-mask-size:cover;mask-size:cover;-webkit-mask-position:center;mask-position:center}
#muro .sombra{background:radial-gradient(circle at 50% 81.5%,rgba(30,21,18,0) 0px,rgba(30,21,18,.15) calc(var(--r,200px)*.3),rgba(30,21,18,.7) calc(var(--r,200px)*.7),rgba(30,21,18,.96) var(--r,200px))}
#muro .calor{background:radial-gradient(circle at 50% 81.5%,rgba(164,95,67,.5) 0px,rgba(164,95,67,0) calc(var(--r,200px)*.85));mix-blend-mode:soft-light}
#puerta{position:absolute;inset:0;width:100%;height:100%}

/* la vela: cilindro bajo apoyado en el alféizar del arco; la llama queda al 81,5 % de alto */
#vela{position:absolute;left:50%;height:21%;aspect-ratio:3/5;transform:translateX(-50%);bottom:calc(100% * (1600 - 1424) / 1600 - 21% * .05)}
#vela svg{width:100%;height:100%;display:block;overflow:visible}
#vela .contacto{position:absolute;left:12%;right:12%;bottom:3.4%;height:4%;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(20,13,10,.55),rgba(20,13,10,0) 70%)}
.vela-svg .llama{transform-box:fill-box;transform-origin:50% 92%;animation:parpadeo 1.7s ease-in-out infinite}
.vela-svg .halo{animation:respira 2.6s ease-in-out infinite}
@keyframes parpadeo{0%,100%{transform:scale(1,1) rotate(-1.5deg)}25%{transform:scale(.94,1.07) rotate(1.5deg)}55%{transform:scale(1.05,.95) rotate(-2deg)}80%{transform:scale(.97,1.03) rotate(1deg)}}
@keyframes respira{0%,100%{opacity:.9}50%{opacity:1}}
#vela.aviva .llama{animation:aviva 1.2s ease-out}
@keyframes aviva{0%{transform:scale(1)}25%{transform:scale(1.8,2.2)}100%{transform:scale(1)}}
#halo{position:absolute;left:50%;top:81.5%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,223,208,.32) 0%,rgba(164,95,67,.2) 30%,rgba(164,95,67,0) 70%);pointer-events:none;transition:transform .9s ease-out}
#tocar-llama{position:absolute;left:50%;top:81.5%;width:84px;height:100px;margin:-50px 0 0 -42px;background:transparent;border:0;border-radius:40px;cursor:pointer}
#tocar-llama::after{content:"";position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:1px solid rgba(232,223,208,.55);animation:latido 2.4s ease-out infinite}
#tocar-llama.hecho::after{display:none}
@keyframes latido{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}

/* el título, arriba, como en la invitación */
#titulo{pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:5.5vh 24px 0;padding:5.5svh 24px 0}
#titulo .ante,#titulo .filete{color:var(--sand)}

/* dentro del arco: primero «Toca la llama»; después, «Muy pronto» */
#pista{top:auto;bottom:calc(25% + 64px);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;pointer-events:none;transition:opacity .6s ease}
#pista svg{width:16px;height:16px}
#pronto{top:auto;bottom:calc(25% + 44px);left:29%;right:29%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity 1.4s ease .5s,transform 1.4s ease .5s}
#pronto .grande{font-family:var(--serif);font-weight:500;font-size:clamp(22px,6.6vw,30px);letter-spacing:.14em;text-transform:uppercase;line-height:1.1}
#pronto .guino{font-family:var(--serif);font-style:italic;font-size:clamp(15px,4.3vw,18px);line-height:1.3;color:var(--sand)}
.encendida #pista{opacity:0}
.encendida #pronto{opacity:1;transform:none}

@media (prefers-reduced-motion: reduce){
  .vela-svg .llama,.vela-svg .halo,#tocar-llama::after{animation:none!important}
  #pronto{transition:none}
}
</style>
</head>
<body>
<main class="escena" id="escena">
  <div class="col">
    <div class="capa" id="muro">
      <img class="cubre" src="img/muro-arco.webp" alt="">
      <div class="calor"></div>
      <div class="sombra"></div>
      <svg id="puerta" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path d="M260 1421 V760 A190 190 0 0 1 640 760 V1421 Z" fill="#1E1512"/>
      </svg>
      <div id="halo"></div>
      <div id="vela" aria-hidden="true"><div class="contacto"></div></div>
      <button id="tocar-llama" type="button" aria-label="Avivar la llama"></button>
    </div>
    <div class="capa" id="titulo">
      <p class="ante">Sábado 20&nbsp;· 03&nbsp;· 2027</p>
      <h1 class="nombres">Roxana<br>&amp; Adrián</h1>
      <p class="lema">Una vida para celebrar</p>
      <div class="filete" aria-hidden="true"><i></i></div>
    </div>
    <div class="capa" id="pista">
      <p class="ante">Toca la llama</p>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6 L8 11 L13 6" fill="none" stroke="#E8DFD0" stroke-width="1.4"/></svg>
    </div>
    <div class="capa" id="pronto" aria-live="polite">
      <p class="grande">Muy pronto</p>
      <p class="guino">aquí encenderás tu invitación</p>
    </div>
  </div>
</main>

<script>
(function(){
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(s){ return document.querySelector(s); };

  /* la vela: el mismo cilindro bajo de la invitación */
  var EDGE='rgba(56,40,32,.38)';
  $('#vela').insertAdjacentHTML('beforeend',
    '<svg class="vela-svg" viewBox="0 0 120 200"><defs>'+
    '<linearGradient id="vg" x1="0" x2="1"><stop offset="0" stop-color="#F4EFE8" stop-opacity=".34"/><stop offset=".12" stop-color="#F4EFE8" stop-opacity=".08"/><stop offset=".5" stop-color="#F4EFE8" stop-opacity=".03"/><stop offset=".86" stop-color="#F4EFE8" stop-opacity=".07"/><stop offset="1" stop-color="#F4EFE8" stop-opacity=".26"/></linearGradient>'+
    '<linearGradient id="vw" x1="0" x2="1"><stop offset="0" stop-color="#cdbda4"/><stop offset=".35" stop-color="#F4EFE8"/><stop offset=".7" stop-color="#E8DFD0"/><stop offset="1" stop-color="#b6a389"/></linearGradient>'+
    '<radialGradient id="vn" cx="50%" cy="8%" r="75%"><stop offset="0" stop-color="#FFF1D6" stop-opacity=".95"/><stop offset=".45" stop-color="#F0D3A8" stop-opacity=".45"/><stop offset="1" stop-color="#E8C9A0" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="vf" cx="50%" cy="78%" r="70%"><stop offset="0" stop-color="#FFF8EC"/><stop offset=".35" stop-color="#F4EFE8"/><stop offset=".62" stop-color="#E8C9A0"/><stop offset="1" stop-color="#A45F43" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="vh"><stop offset="0" stop-color="#F4EFE8" stop-opacity=".55"/><stop offset=".3" stop-color="#E8C9A0" stop-opacity=".28"/><stop offset="1" stop-color="#A45F43" stop-opacity="0"/></radialGradient></defs>'+
    '<circle class="halo" cx="60" cy="124" r="60" fill="url(#vh)"/>'+
    '<ellipse cx="60" cy="100" rx="30" ry="4.6" fill="none" stroke="'+EDGE+'" stroke-width=".8"/>'+
    '<path d="M36 132V184Q36 187 39 187H81Q84 187 84 184V132Z" fill="url(#vw)"/>'+
    '<path d="M36 132V170H84V132Z" fill="url(#vn)"/>'+
    '<ellipse cx="60" cy="132" rx="24" ry="4" fill="#F4EFE8"/><path d="M37 132.5q23 6.5 46 0" fill="none" stroke="#cdbda4" stroke-width=".8"/>'+
    '<ellipse cx="60" cy="132.6" rx="17" ry="2.4" fill="#E8DFD0"/>'+
    '<path d="M60 132V125" stroke="#382820" stroke-width="1.4" stroke-linecap="round"/>'+
    '<g class="llama"><path transform="translate(60 125) scale(1.05)" d="M0-22C5-14 7.5-6 5.2 0C3.8 4.2-3.8 4.2-5.2 0C-7.5-6-5-14 0-22Z" fill="url(#vf)"/><ellipse cx="60" cy="121.8" rx="1.9" ry="4.7" fill="#FFFDF7" opacity=".9"/></g>'+
    '<path d="M30 100V184Q30 190 36 190H84Q90 190 90 184V100" fill="url(#vg)" stroke="'+EDGE+'" stroke-width=".9"/>'+
    '<ellipse cx="60" cy="186" rx="29" ry="3.4" fill="#F4EFE8" opacity=".14"/>'+
    '<path d="M35 106V180" stroke="#F4EFE8" stroke-opacity=".38" stroke-width="2.4" stroke-linecap="round"/>'+
    '<path d="M86 110V176" stroke="#F4EFE8" stroke-opacity=".14" stroke-width="1.4" stroke-linecap="round"/>'+
    '<path d="M35 128V180M86 132V176" stroke="#E8C9A0" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>'+
    '<path d="M30 100a30 4.6 0 0 0 60 0" fill="none" stroke="'+EDGE+'" stroke-width=".9"/>'+
    '<path d="M36 101.5q6 3 14 3.4" stroke="#F4EFE8" stroke-opacity=".5" stroke-width="1"/>'+
    '</svg>');

  var muro=$('#muro'), col=document.querySelector('.col'), vela=$('#vela'), halo=$('#halo');
  var luz=.32, meta=.32;

  $('#tocar-llama').addEventListener('click', function(){
    meta=.82;
    halo.style.transform='scale(1.6)'; setTimeout(function(){ halo.style.transform='scale(1)'; },900);
    vela.classList.remove('aviva'); void vela.offsetWidth; vela.classList.add('aviva');
    this.classList.add('hecho');
    $('#escena').classList.add('encendida');
  });

  function frame(){
    luz += (meta-luz) * (RM ? 1 : .05);
    muro.style.setProperty('--r', Math.round(col.clientHeight*(.14+luz*.66))+'px');
    halo.style.opacity=(.35+luz*.65).toFixed(3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
