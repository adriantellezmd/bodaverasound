<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bodavera Sound · Roxana & Adrián</title>
<meta name="description" content="Roxana & Adrián · 20·03·2027 · Muy pronto, la invitación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Libre+Caslon+Display&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4EFE8; --ivory:#E8DFD0; --sand:#B9A58D; --olive:#6E7255;
    --terracotta:#A45F43; --burgundy:#6A2635; --chocolate:#382820; --magenta:#C2188D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--chocolate);
    font-family:"Cormorant Garamond", Georgia, serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px 16px;
    background-image:
      radial-gradient(ellipse at 12% 8%, rgba(185,165,141,.22), transparent 45%),
      radial-gradient(ellipse at 90% 95%, rgba(164,95,67,.12), transparent 40%);
  }
  main{
    width:100%;max-width:520px;text-align:center;
    border:1px solid rgba(56,40,32,.25);
    outline:1px solid rgba(56,40,32,.12);outline-offset:6px;
    padding:56px 28px 48px;
    background:rgba(232,223,208,.35);
  }
  .lema{
    font-family:Montserrat, sans-serif;font-weight:500;
    font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--burgundy);
  }
  .arco{display:block;margin:28px auto 22px;width:72px;height:auto}
  h1{
    font-family:"Libre Caslon Display", Georgia, serif;font-weight:400;
    font-size:clamp(34px, 9vw, 52px);line-height:1.05;letter-spacing:.06em;
    text-transform:uppercase;
  }
  h1 .y{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;
    text-transform:none;font-size:.6em;letter-spacing:0;margin:6px 0;color:var(--terracotta)}
  .fecha{
    margin-top:28px;font-family:Montserrat, sans-serif;font-weight:500;
    font-size:14px;letter-spacing:.38em;
  }
  .lugar{margin-top:8px;font-size:18px;font-style:italic;color:var(--olive)}
  hr{border:0;height:1px;width:56px;margin:32px auto;background:var(--sand)}
  .pronto{font-size:22px;line-height:1.35}
  .pronto em{color:var(--magenta);font-style:italic}
  .firma{margin-top:22px;font-size:17px;font-style:italic;color:rgba(56,40,32,.75)}
</style>
</head>
<body>
<main>
  <p class="lema">Bodavera Sound</p>

  <svg class="arco" viewBox="0 0 72 60" fill="none" stroke="#6A2635" stroke-width="1.2" aria-hidden="true">
    <path d="M8 58V30a28 28 0 0 1 56 0v28"/>
    <path d="M16 58V31a20 20 0 0 1 40 0v27"/>
    <path d="M36 22c-2 3-2 6 0 8 2-2 2-5 0-8z" fill="#C2188D" stroke="none" opacity=".85"/>
    <line x1="36" y1="30" x2="36" y2="40"/>
  </svg>

  <h1>Roxana <span class="y">&amp;</span> Adrián</h1>

  <p class="fecha">20 · 03 · 2027</p>
  <p class="lugar">Empordà</p>

  <hr>

  <p class="pronto">Muy pronto, aquí mismo,<br>su invitación. <em>Prepárense.</em></p>
  <p class="firma">¡Los esperamos!</p>
</main>
</body>
</html>
